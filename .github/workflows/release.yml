# Builds on every push/PR (artifact), publishes a GitHub Release on tags v*.
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Needs toolkit v0.6.0+ for [[checks]] (colour checks); v0.5.0 added `package`, v0.4.0 hotspot_mode = "pixel".
    # Older toolkits stop with a clear config error.
    uses: hervad/w11-cursor-toolkit/.github/workflows/build-theme.yml@v0.6.0
    with:
      toolkit-ref: v0.6.0
    permissions:
      contents: write
