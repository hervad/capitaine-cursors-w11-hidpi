# Builds on every push/PR (artifact), publishes a GitHub Release on tags v*.
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Needs toolkit v0.5.0+ for `package` (Dark + Light pairs in one zip); v0.4.0 added hotspot_mode = "pixel".
    # Older toolkits stop with a clear config error.
    uses: hervad/w11-cursor-toolkit/.github/workflows/build-theme.yml@v0.5.0
    with:
      toolkit-ref: v0.5.0
    permissions:
      contents: write
