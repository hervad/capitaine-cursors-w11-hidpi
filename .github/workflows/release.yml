# Builds on every push/PR (artifact), publishes a GitHub Release on tags v*.
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Needs toolkit v0.4.0+ for hotspot_mode = "pixel" (older toolkits stop with a clear config error).
    uses: hervad/w11-cursor-toolkit/.github/workflows/build-theme.yml@v0.4.0
    with:
      toolkit-ref: v0.4.0
    permissions:
      contents: write
