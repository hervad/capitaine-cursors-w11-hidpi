# ─────────────────────────────────────────────────────────────────────────────
# theme.toml - the ONLY build input of this repo. Read by `w11cursor` (w11-cursor-toolkit).
#   w11cursor build theme.toml && w11cursor validate theme.toml
# ─────────────────────────────────────────────────────────────────────────────
schema = 1

[theme]
slug        = "capitaine"
name        = "Capitaine Cursors"
version     = "3.2.1"
license     = "LGPL-3.0-or-later"
porter      = "Keefer Rourke and contributors"
description = "Capitaine cursors: dark, light, palette and colour variants"

[upstream]
kind    = "git"
url     = "https://github.com/keeferrourke/capitaine-cursors"
ref     = "06c88433662a4004cf56a6e471b523a0a8880be0"   # latest commit (2021-03-03); v2 vendored the same SVGs
path    = "upstream"
authors = ["Keefer Rourke and contributors"]
license = "LGPL-3.0-or-later (upstream COPYING); based on KDE Breeze"

[sizes]
animated = [32, 48, 64, 72, 80, 96, 120, 128, 144, 192, 256]   # toolkit default + v2's 192/256: nothing v2 had is lost
ani_budget_bytes = 1_850_000   # download cap, not a loader limit. 3.2 palettes: largest busy.ani 1,809,422 B
                               # (palenight-dark), loader offset max 63,808 of 65,535; evidence in the toolkit's
                               # SIZE_POLICY.md "Capitaine palette variants" (was 1_800_000, 2026-10-08)

[render]
renderer      = "resvg"                 # as v2's build.py
design_canvas = 24                      # the SVGs are drawn on a 24-unit grid (Linux Xcursor nominal size)
hotspot_mode  = "pixel"                 # the pixel that CONTAINS the point (floor), as v2's build.py

# ── Variants (18 schemes). Recolour = text replacement in the SVG source, applied top to bottom (toolkit
#    apply_recolor; order matters only where noted). Colour choices and measurements: ADR-9 amendment 2026-11-11
#    in w11-cursor-toolkit docs/DECISIONS.md. Since 3.1 the "... W11 HiDPI" naming;
#    2.0-3.0 used "Capitaine Cursors (Dark|Light)" (INSTALL.md). Dark + Light pairs share one zip
#    (`package`, toolkit v0.5.0): capitaine-w11-hidpi, capitaine-nord/gruvbox/palenight-w11-hidpi.

# Original artwork.
[[variants]]
id          = "dark"
scheme_name = "Capitaine Dark W11 HiDPI"
package     = "capitaine"
svg_dir     = "upstream/src/svg/dark"

[[variants]]
id          = "light"
scheme_name = "Capitaine Light W11 HiDPI"
package     = "capitaine"
svg_dir     = "upstream/src/svg/light"

