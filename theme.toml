# Blue: Material Design #2196f3. Order matters: body first, then the outline becomes the old body colour.
[[variants]]
id          = "blue"
scheme_name = "Capitaine Blue W11 HiDPI"
svg_dir     = "upstream/src/svg/dark"
[variants.recolor]
'<g fill="#fff" transform="matrix(.81818153 0 0 .81818153 -283.30046 -654.25924)">' = '<g fill="#ffffff" transform="matrix(.81818153 0 0 .81818153 -283.30046 -654.25924)">'   # Busy spinner rim stays light, as Dark (3.2.1)
'cy="16.065998" fill="#fff"' = 'cy="16.065998" fill="#ffffff"'   # Help badge ring + Working spinner rim stay light (3.2.1)
'02466-1.810942-.4269649z" fill="#fff"' = '02466-1.810942-.4269649z" fill="#ffffff"'   # Help "?" white, as Capitaine Dark (3.2.1)
'fill="#3daee9" r="' = 'fill="#ffffff" r="'            # resize dots white (3.2.1; Material, first: anchors the dots only)
'fill="#f67400" r="2.500001"' = 'fill="#ffffff" r="2.500001"'   # Move dot white (3.2.1)
"#1a1a1a" = "#2196f3"                           # body (Dark artwork)
"<svg " = '<svg fill="#2196f3" '                # colour for every shape without its own fill
'filter="url(#' = 'fill="#000" filter="url(#'   # ...except the soft shadows, which stay black
