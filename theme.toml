# Roles, files and hotspots exactly as v2's build.py ROLES (24-unit grid). Animation: 24 frames x 2 jiffies.
[cursors.arrow]
svg = "default.svg"
hotspot = [4, 2]

[cursors.help]
svg = "help.svg"
hotspot = [4, 2]

[cursors.working]
frames = "progress-{n:02d}.svg"
frame_count = 24
frame_start = 0
delay = 2
hotspot = [4, 2]

[cursors.busy]
frames = "wait-{n:02d}.svg"
frame_count = 24
frame_start = 0
delay = 2
hotspot = [12, 12]

[cursors.precision]
svg = "crosshair.svg"
hotspot = [12, 12]

[cursors.text]
svg = "text.svg"
hotspot = [12, 12]

[cursors.handwriting]   # pencil tip, not upstream's (4, 4)
svg = "pencil.svg"
hotspot = [3.64, 20.68]

[cursors.unavailable]
svg = "not-allowed.svg"
hotspot = [12, 12]

[cursors.vert]
svg = "size_ver.svg"
hotspot = [12, 12]

[cursors.horz]
svg = "size_hor.svg"
hotspot = [12, 12]

[cursors.dgn1]
svg = "size_fdiag.svg"
hotspot = [12, 12]

[cursors.dgn2]
svg = "size_bdiag.svg"
hotspot = [12, 12]

[cursors.move]
svg = "fleur.svg"
hotspot = [12, 12]

[cursors.alternate]
svg = "up-arrow.svg"
hotspot = [12, 4]

[cursors.link]
svg = "pointer.svg"
hotspot = [12, 6]

[cursors.pin]            # new in v3: v2 left Pin and Person empty
same_as = "link"

[cursors.person]
same_as = "link"
