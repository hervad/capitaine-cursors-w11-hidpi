'cy="757.42456" fill="#fff"' = 'cy="757.42456" fill="#ffffff"'     # Unavailable disc stays light (3.2.1): white, as Capitaine Dark
'fill="#fff"' = 'fill="#1a1a1a"'                # outline and white details (Dark artwork)

